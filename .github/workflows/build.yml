name: Build BeroLauncher
on:
  push:
    branches: [main]
    tags: ['launcher-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install formatting tools
        run: npm ci --ignore-scripts
      - name: Restore .NET projects
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore launcher/StellaViet.Launcher.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore launcher-tests/Launcher.Tests.csproj
          exit $LASTEXITCODE
      - name: Lint and check formatting
        run: npm run lint
      - name: Build with warnings as errors
        run: dotnet build launcher/StellaViet.Launcher.csproj -c Release --no-restore
      - name: Test installer with fixture data
        run: dotnet run --project launcher-tests/Launcher.Tests.csproj -c Release
      - name: Publish Windows x64 launcher
        run: dotnet publish launcher/StellaViet.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/BeroLauncher
      - name: Package launcher
        shell: pwsh
        run: |
          Copy-Item LICENSE,README.md,CHANGELOG.md artifacts/BeroLauncher/
          Copy-Item docs artifacts/BeroLauncher/docs -Recurse
          Compress-Archive -Path artifacts/BeroLauncher/* -DestinationPath artifacts/BeroLauncher-win-x64.zip
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $version = (dotnet msbuild launcher/StellaViet.Launcher.csproj -getProperty:Version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_REF -match '^refs/tags/launcher-v(.+)$' -and $Matches[1] -ne $version) {
            throw "Release tag version $($Matches[1]) does not match project version $version"
          }
          & $iscc "/DMyAppVersion=$version" installer/BeroLauncher.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test installer lifecycle
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/BeroLauncher-Setup-*.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'BeroLauncher-Install-Test'
          $arguments = "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`""
          $install = Start-Process -FilePath $setup.FullName -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }
          if (!(Test-Path (Join-Path $installDir 'BeroLauncher.exe'))) { throw 'Installed launcher was not found' }
          if (!(Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\BeroLauncher.lnk'))) { throw 'Start Menu shortcut was not created' }
          if (!(Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'BeroLauncher.lnk'))) { throw 'Desktop shortcut was not created' }
          $smoke = Join-Path $env:RUNNER_TEMP 'BeroLauncher-Install-Test.png'
          $launch = Start-Process -FilePath (Join-Path $installDir 'BeroLauncher.exe') -ArgumentList @('--smoke-test', $smoke) -Wait -PassThru
          if ($launch.ExitCode -ne 0 -or !(Test-Path $smoke)) { throw 'Installed launcher smoke test failed' }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path $installDir) { throw 'Application files remain after uninstall' }
          if (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\BeroLauncher.lnk')) { throw 'Start Menu shortcut remains after uninstall' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) 'BeroLauncher.lnk')) { throw 'Desktop shortcut remains after uninstall' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeroLauncher-win-x64
          path: |
            artifacts/BeroLauncher-win-x64.zip
            artifacts/BeroLauncher-Setup-*.exe
  release:
    if: github.event_name == 'push' && github.repository == 'maibui7879/BeroLauncher' && startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: launcher-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BeroLauncher-win-x64
          path: artifacts
      - name: Publish launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/BeroLauncher-win-x64.zip artifacts/BeroLauncher-Setup-*.exe --verify-tag --title "BeroLauncher $RELEASE_TAG" --notes "Windows x64. Choose the installer or portable ZIP. Launcher only; compatible language pack is distributed separately."
