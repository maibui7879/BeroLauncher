name: Build BeroLauncher
on:
  push:
    branches: [main]
    tags: ['launcher-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install formatting tools
        run: npm ci --ignore-scripts
      - name: Restore .NET projects
        shell: pwsh
        run: |
          dotnet tool restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore launcher/StellaViet.Launcher.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore launcher-tests/Launcher.Tests.csproj
          exit $LASTEXITCODE
      - name: Lint and check formatting
        run: npm run lint
      - name: Build with warnings as errors
        run: dotnet build launcher/StellaViet.Launcher.csproj -c Release --no-restore
      - name: Test installer with fixture data
        run: dotnet run --project launcher-tests/Launcher.Tests.csproj -c Release
      - name: Publish Windows x64 launcher
        run: dotnet publish launcher/StellaViet.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/BeroLauncher
      - name: Package launcher
        shell: pwsh
        run: |
          Copy-Item LICENSE,README.md,CHANGELOG.md artifacts/BeroLauncher/
          Copy-Item docs artifacts/BeroLauncher/docs -Recurse
          Compress-Archive -Path artifacts/BeroLauncher/* -DestinationPath artifacts/BeroLauncher-win-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BeroLauncher-win-x64
          path: artifacts/BeroLauncher-win-x64.zip
  release:
    if: github.event_name == 'push' && github.repository == 'maibui7879/BeroLauncher' && startsWith(github.ref, 'refs/tags/launcher-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: launcher-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: BeroLauncher-win-x64
          path: artifacts
      - name: Publish launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/BeroLauncher-win-x64.zip --verify-tag --title "BeroLauncher $RELEASE_TAG" --notes "Windows x64. Launcher only; compatible language pack is distributed separately."
